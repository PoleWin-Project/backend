                "200":
                    description: Radio de l'équipe
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: ok }
                                    radio: { type: array, items: { $ref: "#/components/schemas/F1TeamRadio" } }

    /api/v1/openf1/sessions/{sessionKey}/race-control:
        get:
            tags: [OpenF1]
            summary: Messages Race Control d'une session
            description: >
                Retourne les messages de direction de course : drapeaux, safety car,
                virtual safety car, DRS, etc.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Événements race control
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    events:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1RaceControl"

    /api/v1/openf1/sessions/{sessionKey}/weather:
        get:
            tags: [OpenF1]
            summary: Météo d'une session
            description: Retourne les relevés météo (température, humidité, pluie, vent).
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Relevés météo
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    weather:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Weather"

    /api/v1/openf1/sessions/{sessionKey}/pit:
        get:
            tags: [OpenF1]
            summary: Pit stops d'une session
            description: Retourne tous les arrêts aux stands avec la durée par pilote.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Pit stops
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    pit:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Pit"

    /api/v1/openf1/sessions/{sessionKey}/stints:
        get:
            tags: [OpenF1]
            summary: Stints d'une session
            description: Retourne les stints (compound pneu, tours de début/fin) par pilote.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Stints
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    stints:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Stint"

    /api/v1/openf1/sessions/{sessionKey}/team-radio:
        get:
            tags: [OpenF1]
            summary: Team radio d'une session
            description: Retourne les enregistrements radio équipe avec URL audio.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Enregistrements radio
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    radio:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1TeamRadio"

    /api/v1/openf1/sessions/{sessionKey}/results:
        get:
            tags: [OpenF1]
            summary: Résultats d'une session
            description: >
                Retourne le classement final d'une session.

                - **Race / Sprint** : classement par position (dernière position connue par pilote).
                - **Qualif / EL** : classement par meilleur temps au tour.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Résultats de la session
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    results:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1SessionResult"
                "404":
                    description: Session introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── OpenF1 Drivers ────────────────────────────────────────────────────────

    /api/v1/openf1/drivers:
        get:
            tags: [OpenF1]
            summary: Liste des pilotes
            description: >
                Retourne les pilotes filtrables par session ou acronyme.
                Sans paramètre, retourne les pilotes de la session la plus récente.
            parameters:
                - name: session_key
                  in: query
                  schema:
                      type: integer
                      example: 9158
                - name: name_acronym
                  in: query
                  schema:
                      type: string
                      example: VER
            responses:
                "200":
                    description: Liste des pilotes
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    drivers:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Driver"

    /api/v1/openf1/drivers/{driverNumber}:
        get:
            tags: [OpenF1]
            summary: Détail d'un pilote
            description: Retourne les infos du pilote pour la session spécifiée (ou la dernière connue).
            parameters:
                - name: driverNumber
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 1
                - name: session_key
                  in: query
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Détail du pilote
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    driver:
                                        $ref: "#/components/schemas/F1Driver"
                "404":
                    description: Pilote introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── OpenF1 Teams ──────────────────────────────────────────────────────────

    /api/v1/openf1/teams:
        get:
            tags: [OpenF1]
            summary: Liste des équipes
            description: >
                Retourne les équipes avec leurs pilotes dérivées des données OpenF1.
                Sans paramètre, utilise la dernière session connue.
            parameters:
                - name: session_key
                  in: query
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Liste des équipes
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    teams:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Team"

    # ── OpenF1 Standings ──────────────────────────────────────────────────────

    /api/v1/openf1/standings/drivers:
        get:
            tags: [OpenF1]
            summary: Classement championnat pilotes
            description: >
                Retourne le classement actuel du championnat pilotes via l'endpoint
                `championship_drivers` d'OpenF1 (session_key=latest).
                Enrichi avec les données pilotes (nom, équipe, photo).
            parameters:
                - name: year
                  in: query
                  description: Année (actuellement non utilisé, retourne toujours la saison en cours)
                  schema:
                      type: integer
                      example: 2025
            responses:
                "200":
                    description: Classement pilotes
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    standings:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1DriverStanding"

    /api/v1/openf1/standings/teams:
        get:
            tags: [OpenF1]
            summary: Classement championnat constructeurs
            description: >
                Retourne le classement actuel du championnat constructeurs via l'endpoint
                `championship_teams` d'OpenF1 (session_key=latest).
            parameters:
                - name: year
                  in: query
                  description: Année (actuellement non utilisé, retourne toujours la saison en cours)
                  schema:
                      type: integer
                      example: 2025
            responses:
                "200":
                    description: Classement constructeurs
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    standings:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1TeamStanding"

    # ── OpenF1 Live (SSE) ─────────────────────────────────────────────────────

    /api/v1/openf1/live/session:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — session en cours
            description: >
                Connexion **Server-Sent Events** persistante. Envoie la session courante
                immédiatement (cache), puis toutes les 30 s si elle change.

                **Event name :** `session`

                **Heartbeat :** `:heartbeat` toutes les 15 s pour maintenir la connexion.
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: session\ndata: {\"session_key\": 9158, ...}\n\n"

    /api/v1/openf1/live/race-control:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — race control en temps réel
            description: >
                Reçoit uniquement les **nouveaux** messages race control toutes les 5 s
                (safety car, drapeau rouge, VSC, DRS…). Delta-only.

                **Event name :** `race_control`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: race_control\ndata: [{\"message\": \"SAFETY CAR DEPLOYED\", ...}]\n\n"

    /api/v1/openf1/live/positions:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — positions en temps réel
            description: >
                Classement complet mis à jour toutes les 5 s (1 entrée par pilote,
                dédupliquée sur `driver_number`).

                **Event name :** `positions`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: positions\ndata: [{\"driver_number\": 1, \"position\": 1, ...}]\n\n"

    /api/v1/openf1/live/laps:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — tours en temps réel
            description: >
                Envoie les nouveaux tours complétés toutes les 10 s. Delta-only.

                **Event name :** `laps`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: laps\ndata: [{\"driver_number\": 1, \"lap_number\": 12, ...}]\n\n"

    /api/v1/openf1/live/intervals:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — intervalles en temps réel
            description: >
                Écarts par rapport au leader mis à jour toutes les 10 s
                (1 entrée par pilote, dédupliquée).

                **Event name :** `intervals`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: intervals\ndata: [{\"driver_number\": 1, \"gap_to_leader\": 0, ...}]\n\n"

# ─── Components ───────────────────────────────────────────────────────────────

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: "JWT dans l'en-tête Authorization: Bearer <token>"

    parameters:
        SessionId:
            name: sessionId
            in: path
            required: true
            schema:
                type: integer
                example: 1
        PredictionId:
            name: predictionId
            in: path
            required: true
            schema:
                type: integer
                example: 5

    responses:
        NotFound:
            description: Ressource introuvable
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ValidationError:
            description: Données invalides
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Unauthorized:
            description: JWT manquant ou invalide
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Forbidden:
            description: Rôle admin requis
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"

    schemas:

        # ── Sessions ──────────────────────────────────────────────────────────

        RaceSession:
            type: object
            properties:
                id:
                    type: integer
                    example: 1
                name:
                    type: string
                    example: "Italian Grand Prix — Race"
                type:
                    type: string
                    enum: [Race, Qualifying, Sprint, "Sprint Qualifying", "Practice 1", "Practice 2", "Practice 3"]
                    example: Race
                idCourseExternal:
                    type: integer
                    nullable: true
                    description: Clé session OpenF1
                    example: 9158
                dateStart:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2024-09-01T13:00:00.000Z"
            required: [id, name, type]

        SessionResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                session:
                    $ref: "#/components/schemas/RaceSession"

        SessionsListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/RaceSession"
                total:
                    type: integer
                limit:
                    type: integer
                offset:
                    type: integer

        CreateSessionRequest:
            type: object
            required: [name, type]
            properties:
                name:
                    type: string
                    maxLength: 200
                    example: "Italian Grand Prix — Race"
                type:
                    type: string
                    enum: [Race, Qualifying, Sprint, "Sprint Qualifying", "Practice 1", "Practice 2", "Practice 3"]
                idCourseExternal:
                    type: integer
                    example: 9158
                dateStart:
                    type: string
                    format: date-time
                    example: "2024-09-01T13:00:00Z"

        UpdateSessionRequest:
            type: object
            properties:
                name:
                    type: string
                    maxLength: 200
                type:
                    type: string
                    enum: [Race, Qualifying, Sprint, "Sprint Qualifying", "Practice 1", "Practice 2", "Practice 3"]
                idCourseExternal:
                    type: integer
                dateStart:
                    type: string
                    format: date-time

        # ── Predictions & Pronostics ───────────────────────────────────────────

        Prediction:
            type: object
            properties:
                id:
                    type: integer
                    example: 5
                sessionId:
                    type: integer
                    example: 1
                title:
                    type: string
                    example: "Qui remporte la course ?"
                scope:
                    type: string
                    nullable: true
                    example: "race"
                closesAt:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2024-09-01T13:00:00.000Z"
                createdAt:
                    type: string
                    format: date-time
            required: [id, sessionId, title]

        PredictionResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                prediction:
                    $ref: "#/components/schemas/Prediction"

        PredictionsListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                predictions:
                    type: array
                    items:
                        $ref: "#/components/schemas/Prediction"

        CreatePredictionRequest:
            type: object
            required: [title]
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: "Qui remporte la course ?"
                scope:
                    type: string
                    nullable: true
                    maxLength: 100
                    example: "race"
                closesAt:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2024-09-01T13:00:00Z"
                defaultMultiplier:
                    type: number
                    minimum: 0.01
                    default: 2
                    description: Multiplicateur appliqué aux paris gagnants
                    example: 2.5

        UpdatePredictionRequest:
            type: object
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 255
                scope:
                    type: string
                    nullable: true
                closesAt:
                    type: string
                    format: date-time
                    nullable: true

        ResolveRequest:
            type: object
            required: [winningValue]
            properties:
                winningValue:
                    type: string
                    minLength: 1
                    maxLength: 500
                    example: "Leclerc"

        PronosticDetail:
            type: object
            properties:
                pronosticId:
                    type: integer
                    example: 12
                value:
                    type: string
                    description: Valeur prédite par l'utilisateur
                    example: "Leclerc"
                multiplier:
                    type: number
                    nullable: true
                    description: Multiplicateur appliqué si gagnant
                    example: 2.5

        Pronostic:
            type: object
            properties:
                id:
                    type: integer
                    example: 12
                userId:
                    type: integer
                    example: 7
                predictionId:
                    type: integer
                    example: 5
                pointsStaked:
                    type: integer
                    description: Points misés (déjà déduits du solde)
                    example: 100
                pointsEarned:
                    type: integer
                    description: Points gagnés (0 si pas encore résolu ou perdu)
                    example: 250
                status:
                    type: string
                    enum: [draft, submitted, won, lost, void]
                    example: submitted
                detail:
                    $ref: "#/components/schemas/PronosticDetail"
            required: [id, userId, predictionId, pointsStaked, pointsEarned, status]

        PronosticResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                pronostic:
                    $ref: "#/components/schemas/Pronostic"

        PronosticsListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                pronostics:
                    type: array
                    items:
                        $ref: "#/components/schemas/Pronostic"

        MyPronosticsListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Pronostic"
                total:
                    type: integer
                limit:
                    type: integer
                offset:
                    type: integer

        PlacePronosticRequest:
            type: object
            required: [value, pointsStaked]
            properties:
                value:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: Valeur prédite (nom du pilote, résultat…)
                    example: "Leclerc"
                pointsStaked:
                    type: integer
                    minimum: 1
                    description: Points à miser (déduits immédiatement)
                    example: 100

        UpdatePronosticRequest:
            type: object
            properties:
                value:
                    type: string
                    minLength: 1
                    maxLength: 500
                    example: "Verstappen"
                pointsStaked:
                    type: integer
                    minimum: 1
                    example: 150

        # ── Badges ────────────────────────────────────────────────────────────

        Badge:
            type: object
            properties:
                id:
                    type: integer
                    example: 1
                name:
                    type: string
                    example: "Prophète"
                code:
                    type: string
                    nullable: true
                    example: "prophet"
                description:
                    type: string
                    nullable: true
                    example: "A prédit le résultat exact 10 fois"
                imageUrl:
                    type: string
                    format: uri
                    nullable: true
                    example: "https://cdn.polewin.app/badges/prophet.png"
                rarity:
                    type: string
                    nullable: true
                    enum: [common, rare, epic, legendary]
                    example: "rare"
                createdAt:
                    type: string
                    format: date-time
            required: [id, name]

        UserBadgeItem:
            type: object
            properties:
                id:
                    type: integer
                    example: 42
                userId:
                    type: integer
                    example: 7
                badgeId:
                    type: integer
                    example: 1
                awardedAt:
                    type: string
                    format: date-time
                    example: "2024-09-01T15:30:00.000Z"
                badge:
                    $ref: "#/components/schemas/Badge"
            required: [id, userId, badgeId, awardedAt]

        BadgesListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                badges:
                    type: array
                    items:
                        $ref: "#/components/schemas/Badge"
            required: [status, badges]

        BadgeResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                badge:
                    $ref: "#/components/schemas/Badge"
            required: [status, badge]

        UserBadgesResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                badges:
                    type: array
                    items:
                        $ref: "#/components/schemas/UserBadgeItem"
            required: [status, badges]

        UserBadgeItemResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                userBadge:
                    $ref: "#/components/schemas/UserBadgeItem"
            required: [status, userBadge]

        CreateBadgeRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: "Prophète"
                code:
                    type: string
                    minLength: 1
                    maxLength: 50
                    example: "prophet"
                description:
                    type: string
                    nullable: true
                    maxLength: 1000
                    example: "A prédit le résultat exact 10 fois"
                imageUrl:
                    type: string
                    nullable: true
                    format: uri
                    maxLength: 500
                    example: "https://cdn.polewin.app/badges/prophet.png"
                rarity:
                    type: string
                    nullable: true
                    enum: [common, rare, epic, legendary]
                    example: "rare"

        UpdateBadgeRequest:
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                code:
                    type: string
                    minLength: 1
                    maxLength: 50
                description:
                    type: string
                    nullable: true
                    maxLength: 1000
                imageUrl:
                    type: string
                    nullable: true
                    format: uri
                    maxLength: 500
                rarity:
                    type: string
                    nullable: true
                    enum: [common, rare, epic, legendary]

        AwardBadgeRequest:
            type: object
            required: [badgeId]
            properties:
                badgeId:
                    type: integer
                    minimum: 1
                    example: 3

        # ── OpenF1 ────────────────────────────────────────────────────────────

        F1Meeting:
            type: object
            properties:
                meeting_key:
                    type: integer
                    example: 1217
                meeting_name:
                    type: string
                    example: "Italian Grand Prix"
                meeting_official_name:
                    type: string
                    example: "FORMULA 1 PIRELLI GRAN PREMIO D'ITALIA 2024"
                circuit_short_name:
                    type: string
                    example: "Monza"
                country_name:
                    type: string
                    example: "Italy"
                country_code:
                    type: string
                    example: "IT"
                location:
                    type: string
                    example: "Monza"
                date_start:
                    type: string
                    format: date-time
                    example: "2026-03-08T04:00:00+00:00"
                date_end:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2026-03-08T06:00:00+00:00"
                circuit_type:
                    type: string
                    nullable: true
                    example: "Permanent"
                circuit_image:
                    type: string
                    nullable: true
                    format: uri
                    example: "https://media.formula1.com/content/dam/fom-website/..."
                circuit_info_url:
                    type: string
                    nullable: true
                    format: uri
                country_flag:
                    type: string
                    nullable: true
                    format: uri
                    example: "https://media.formula1.com/content/dam/fom-website/2018-redesign-assets/Flags%2016x9/australia-flag.png"
                gmt_offset:
                    type: string
                    example: "11:00:00"
                year:
                    type: integer
                    example: 2026

        F1Session:
            type: object
            properties:
                session_key:
                    type: integer
                    example: 9158
                meeting_key:
                    type: integer
                    example: 1217
                session_name:
                    type: string
                    example: "Race"
                session_type:
                    type: string
