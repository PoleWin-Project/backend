openapi: 3.0.3
info:
    title: PoleWin API
    version: 1.0.0
    description: >
        API backend PoleWin (F1) — Express 5 + TypeScript + PostgreSQL/Sequelize.

        **Authentification** : Bearer JWT (access token 15 min).
        Obtenez un token via `POST /api/v1/auth/login` ou `POST /api/v1/auth/register`,
        puis rafraîchissez-le via `POST /api/v1/auth/refresh` (refresh token 7 jours).

servers:
    - url: http://localhost:8000
      description: Serveur local

tags:
    - name: Auth
      description: Inscription, connexion, tokens, mot de passe
    - name: Utilisateurs
      description: Profil et compte utilisateur
    - name: Admin
      description: Administration (rôle admin requis)
    - name: Health
      description: Endpoints de diagnostic

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:

    # ── Health ────────────────────────────────────────────────────────────────

    /api/v1/health:
        get:
            tags: [Health]
            summary: Vérifier que l'API est en ligne
            responses:
                "200":
                    description: API opérationnelle
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthResponse"
                "500":
                    description: Erreur serveur
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Auth ──────────────────────────────────────────────────────────────────

    /api/v1/auth/register:
        post:
            tags: [Auth]
            summary: Créer un compte
            description: >
                Crée un compte utilisateur. Le mot de passe doit respecter les règles de sécurité :
                8 caractères minimum, au moins une majuscule, une minuscule, un chiffre et un caractère spécial.
                Retourne un access token (15 min) et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
                        example:
                            email: "alex@example.com"
                            username: "alexf1"
                            password: "Passw0rd!"
                            confirmPassword: "Passw0rd!"
                            country: "France"
                            language: "fr"
            responses:
                "201":
                    description: Compte créé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "400":
                    description: Validation échouée ou email/username déjà utilisé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Connexion
            description: >
                Connexion par email ou username. Retourne un access token (15 min)
                et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
                        example:
                            identifier: "alex@example.com"
                            password: "Passw0rd!"
            responses:
                "200":
                    description: Connexion réussie
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "401":
                    description: Identifiants invalides
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/refresh:
        post:
            tags: [Auth]
            summary: Rafraîchir les tokens
            description: >
                Échange un refresh token valide contre un nouvel access token (15 min)
                et un nouveau refresh token (7 jours). Rotation à chaque appel.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RefreshTokenRequest"
            responses:
                "200":
                    description: Tokens rafraîchis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RefreshResponse"
                "401":
                    description: Refresh token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/verify-email:
        get:
            tags: [Auth]
            summary: Vérifier l'adresse email
            description: Valide le token de vérification d'email envoyé à l'inscription.
            parameters:
                - name: token
                  in: query
                  required: true
                  description: Token JWT de vérification d'email
                  schema:
                      type: string
            responses:
                "200":
                    description: Email vérifié avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/resend-verify-email:
        post:
            tags: [Auth]
            summary: Renvoyer l'email de vérification
            description: Renvoie un token de vérification d'email. Requiert d'être connecté.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Email renvoyé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Email déjà vérifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/change-password:
        post:
            tags: [Auth]
            summary: Changer le mot de passe
            description: >
                Modifie le mot de passe de l'utilisateur connecté.
                Le nouveau mot de passe doit respecter les règles de sécurité.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ChangePasswordRequest"
            responses:
                "200":
                    description: Mot de passe modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Validation échouée ou mot de passe actuel incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/forgot-password:
        post:
            tags: [Auth]
            summary: Demander la réinitialisation du mot de passe
            description: >
                Envoie un email de réinitialisation si l'adresse est connue.
                Retourne toujours 200 pour éviter l'énumération d'emails.
                Le token de réinitialisation expire après 1 heure.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ForgotPasswordRequest"
                        example:
                            email: "alex@example.com"
            responses:
                "200":
                    description: Demande traitée (email envoyé si l'adresse existe)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/reset-password:
        post:
            tags: [Auth]
            summary: Réinitialiser le mot de passe
            description: >
                Réinitialise le mot de passe à partir du token reçu par email.
                Le token expire après 1 heure. Le nouveau mot de passe doit respecter
                les règles de sécurité.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Mot de passe réinitialisé avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide/expiré ou validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/delete-account:
        delete:
            tags: [Auth]
            summary: Supprimer le compte
            description: >
                Supprime définitivement le compte et toutes les données associées
                (profil, pronostics, ligues, conversations). Requiert le mot de passe.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeleteAccountRequest"
            responses:
                "200":
                    description: Compte supprimé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Mot de passe incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Utilisateurs ──────────────────────────────────────────────────────────

    /api/v1/users/me:
        get:
            tags: [Utilisateurs]
            summary: Mon profil complet
            description: Retourne le compte courant avec profil et rôles.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Profil complet
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        patch:
            tags: [Utilisateurs]
            summary: Mettre à jour mon profil
            description: Patch partiel du compte et/ou du profil utilisateur.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateMeRequest"
            responses:
                "200":
                    description: Profil mis à jour
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: Conflit (username déjà utilisé)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/users/{id}/public:
        get:
            tags: [Utilisateurs]
            summary: Profil public d'un utilisateur
            description: >
                Retourne le profil uniquement si l'utilisateur est actif
                et que son profil est public.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            responses:
                "200":
                    description: Profil public
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserPublicResponse"
                "404":
                    description: Profil introuvable (ou non public / utilisateur inactif)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Admin ─────────────────────────────────────────────────────────────────

    /api/v1/admin/users:
        get:
            tags: [Admin]
            summary: Lister les utilisateurs
            description: Nécessite un JWT avec le rôle `admin`. Liste paginée.
            security:
                - bearerAuth: []
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Recherche par email ou username
                  schema:
                      type: string
                      maxLength: 120
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                - name: offset
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
            responses:
                "200":
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AdminUsersListResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/users/{id}:
        patch:
            tags: [Admin]
            summary: Modifier un utilisateur
            description: >
                Nécessite un JWT avec le rôle `admin`.
                Permet d'activer/désactiver un compte et de valider l'email.
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AdminUpdateUserRequest"
            responses:
                "200":
                    description: Utilisateur modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Utilisateur introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

# ─── Components ───────────────────────────────────────────────────────────────

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: "JWT dans l'en-tête Authorization: Bearer <token>"

    schemas:

        # ── Règles de mot de passe ────────────────────────────────────────────
        # 8 car. min · 1 majuscule · 1 minuscule · 1 chiffre · 1 caractère spécial

        PasswordStrong:
            type: string
            minLength: 8
            maxLength: 200
            description: >
                Mot de passe fort : 8 caractères minimum, au moins une majuscule,
                une minuscule, un chiffre et un caractère spécial (!@#$%^&*…).
            example: "Passw0rd!"

        # ── Requêtes Auth ─────────────────────────────────────────────────────

        RegisterRequest:
            type: object
            required: [email, username, password, confirmPassword]
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 255
                    example: "alex@example.com"
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                    example: "alexf1"
                password:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmPassword:
                    type: string
                    description: Doit être identique à `password`
                    example: "Passw0rd!"
                dateOfBirth:
                    type: string
                    format: date
                    example: "2001-06-20"
                country:
                    type: string
                    maxLength: 100
                    example: "France"
                language:
                    type: string
                    maxLength: 20
                    example: "fr"

        LoginRequest:
            type: object
            required: [identifier, password]
            properties:
                identifier:
                    type: string
                    minLength: 3
                    maxLength: 255
                    description: Email ou username
                    example: "alex@example.com"
                password:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "Passw0rd!"

        RefreshTokenRequest:
            type: object
            required: [refreshToken]
            properties:
                refreshToken:
                    type: string
                    description: Refresh token JWT (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."

        ChangePasswordRequest:
            type: object
            required: [currentPassword, newPassword, confirmNewPassword]
            properties:
                currentPassword:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "OldPassw0rd!"
                newPassword:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmNewPassword:
                    type: string
                    description: Doit être identique à `newPassword`
                    example: "NewPassw0rd!"

        ForgotPasswordRequest:
            type: object
            required: [email]
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 255
                    example: "alex@example.com"

        ResetPasswordRequest:
            type: object
            required: [token, newPassword, confirmNewPassword]
            properties:
                token:
                    type: string
                    description: Token de réinitialisation reçu par email (valide 1h)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                newPassword:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmNewPassword:
                    type: string
                    description: Doit être identique à `newPassword`
                    example: "NewPassw0rd!"

        DeleteAccountRequest:
            type: object
            required: [password]
            properties:
                password:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "Passw0rd!"

        # ── Réponses Auth ─────────────────────────────────────────────────────

        AuthUser:
            type: object
            properties:
                id:
                    type: string
                    description: BIGINT renvoyé en string
                    example: "1"
                email:
                    type: string
                    format: email
                    example: "alex@example.com"
                username:
                    type: string
                    example: "alexf1"
                roles:
                    type: array
                    items:
                        type: string
                    example: ["user"]

        AuthTokensResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    example: true
                accessToken:
                    type: string
                    description: JWT d'accès (15 min)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                refreshToken:
                    type: string
                    description: JWT de rafraîchissement (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                verifyEmailToken:
                    type: string
                    description: Token de vérification email (24h) — uniquement à l'inscription
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                user:
                    $ref: "#/components/schemas/AuthUser"
            required: [ok, accessToken, refreshToken, user]

        RefreshResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    example: true
                accessToken:
                    type: string
                    description: Nouvel access token (15 min)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                refreshToken:
                    type: string
                    description: Nouveau refresh token (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
            required: [ok, accessToken, refreshToken]

        StatusOkResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
            required: [status]

        # ── Utilisateurs ──────────────────────────────────────────────────────

        UserProfile:
            type: object
            properties:
                displayName:
                    type: string
                    nullable: true
                    example: "Alexandre"
                avatarUrl:
                    type: string
                    format: uri
                    nullable: true
                    example: "https://cdn.polewin.app/avatars/123.png"
                bio:
                    type: string
                    nullable: true
                    example: "Fan de F1 et de statistiques."
                favoriteTeamCode:
                    type: string
                    nullable: true
                    example: "ferrari"
                favoriteDriverCode:
                    type: string
                    nullable: true
                    example: "leclerc"
                timeZone:
                    type: string
                    nullable: true
                    example: "Europe/Paris"
                isProfilePublic:
                    type: boolean
                    example: true
                showStats:
                    type: boolean
                    example: true

        User:
            type: object
            properties:
                id:
                    type: string
                    description: BIGINT renvoyé en string
                    example: "1"
                email:
                    type: string
                    format: email
                    example: "alex@example.com"
                username:
                    type: string
                    example: "alexf1"
                dateOfBirth:
                    type: string
                    format: date
                    nullable: true
                    example: "2001-06-20"
                country:
                    type: string
                    nullable: true
                    example: "France"
                language:
                    type: string
                    nullable: true
                    example: "fr"
                isEmailVerified:
                    type: boolean
                    example: false
                isActive:
                    type: boolean
                    example: true
                lastLoginAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                profile:
                    $ref: "#/components/schemas/UserProfile"
                roles:
                    type: array
                    items:
                        type: string
                    example: ["user"]

        UserMeResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                user:
                    $ref: "#/components/schemas/User"
            required: [status, user]

        UserPublic:
            type: object
            properties:
                id:
                    type: string
                    example: "12"
                username:
                    type: string
                    example: "fanF1"
                country:
                    type: string
                    nullable: true
                language:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                profile:
                    $ref: "#/components/schemas/UserProfile"
            required: [id, username, createdAt, profile]

        UserPublicResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                user:
                    $ref: "#/components/schemas/UserPublic"
            required: [status, user]

        UpdateMeRequest:
            type: object
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                country:
                    type: string
                    nullable: true
                    maxLength: 100
                language:
                    type: string
                    nullable: true
                    maxLength: 20
                dateOfBirth:
                    type: string
                    format: date
                    nullable: true
                profile:
                    type: object
                    properties:
                        displayName:
                            type: string
                            nullable: true
                            maxLength: 100
                        avatarUrl:
                            type: string
                            nullable: true
                            maxLength: 500
                            format: uri
                        bio:
                            type: string
                            nullable: true
                            maxLength: 2000
                        favoriteTeamCode:
                            type: string
                            nullable: true
                            maxLength: 50
                        favoriteDriverCode:
                            type: string
                            nullable: true
                            maxLength: 50
                        timeZone:
                            type: string
                            nullable: true
                            maxLength: 64
                        isProfilePublic:
                            type: boolean
                        showStats:
                            type: boolean

        # ── Admin ─────────────────────────────────────────────────────────────

        AdminUpdateUserRequest:
            type: object
            properties:
                isActive:
                    type: boolean
                isEmailVerified:
                    type: boolean

        AdminUserListItem:
            type: object
            properties:
                id:
                    type: string
                    example: "1"
                email:
                    type: string
                    format: email
                username:
                    type: string
                isActive:
                    type: boolean
                isEmailVerified:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                lastLoginAt:
                    type: string
                    format: date-time
                    nullable: true
                roles:
                    type: array
                    items:
                        type: string
            required: [id, email, username, isActive, isEmailVerified, createdAt]

        AdminUsersListResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/AdminUserListItem"
                total:
                    type: integer
                    example: 42
                limit:
                    type: integer
                    example: 20
                offset:
                    type: integer
                    example: 0
            required: [status, items, total, limit, offset]

        # ── Erreurs ───────────────────────────────────────────────────────────

        ErrorResponse:
            type: object
            properties:
                status:
                    type: string
                    example: error
                code:
                    type: string
                    example: VALIDATION_ERROR
                message:
                    type: string
                    example: "Données invalides"
            required: [status, message]

