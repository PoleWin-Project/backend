                    example: "LEC"
                team_name:
                    type: string
                    example: "Ferrari"
                team_colour:
                    type: string
                    example: "E8002D"
                country_code:
                    type: string
                    example: "MON"
                headshot_url:
                    type: string
                    format: uri
                    nullable: true
                    example: "https://www.formula1.com/content/dam/fom-website/drivers/C/CHALEC01_Charles_Leclerc/chalec01.png"

        F1RaceControl:
            type: object
