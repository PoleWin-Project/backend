                - { name: teamName,   in: path, required: true, schema: { type: string,  example: Ferrari } }
            responses:
                "200":
                    description: Stints de l'équipe
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: ok }
                                    stints: { type: array, items: { $ref: "#/components/schemas/F1Stint" } }

    /api/v1/openf1/sessions/{sessionKey}/teams/{teamName}/team-radio:
        get:
            tags: [OpenF1]
            summary: Team radio d'une équipe
            description: Agrège les messages radio de tous les pilotes de l'équipe, trié par date.
            parameters:
                - { name: sessionKey, in: path, required: true, schema: { type: integer, example: 9158 } }
                - { name: teamName,   in: path, required: true, schema: { type: string,  example: Ferrari } }
