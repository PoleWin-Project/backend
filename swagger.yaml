openapi: 3.0.3
info:
    title: PoleWin API
    version: 1.0.0
    description: >
        API backend PoleWin (F1) — Express 5 + TypeScript + PostgreSQL/Sequelize.

        **Authentification** : Bearer JWT (access token 15 min).
        Obtenez un token via `POST /api/v1/auth/login` ou `POST /api/v1/auth/register`,
        puis rafraîchissez-le via `POST /api/v1/auth/refresh` (refresh token 7 jours).

servers:
    - url: http://localhost:8000
      description: Serveur local

tags:
    - name: Auth
      description: Inscription, connexion, tokens, mot de passe
    - name: Utilisateurs
      description: Profil et compte utilisateur
    - name: Admin
      description: Administration (rôle admin requis)
    - name: Health
      description: Endpoints de diagnostic
    - name: Sessions
      description: Race sessions F1 (qualifying, race, sprint…)
    - name: Predictions
      description: Questions de pronostic par session — gérées par l'admin
    - name: Pronostics
      description: Paris des utilisateurs sur les prédictions (points stakés)
    - name: Badges
      description: Badges utilisateur — catalogue et attribution
    - name: OpenF1
      description: Données F1 statiques via l'API OpenF1 (public, aucune auth requise)
    - name: OpenF1 Live
      description: Streams temps réel SSE via OpenF1 — connexion persistante

# ─── Paths ────────────────────────────────────────────────────────────────────

    - name: Race Sessions
      description: Calendrier des sessions de course
    - name: Chat Channels
      description: Canal live unique par race session
    - name: Messages
      description: Messages des canaux de chat

paths:

    # ── Health ────────────────────────────────────────────────────────────────

    /api/v1/health:
        get:
            tags: [Health]
            summary: Vérifier que l'API est en ligne
            responses:
                "200":
                    description: API opérationnelle
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthResponse"
                "500":
                    description: Erreur serveur
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/version:
        get:
            tags: [Health]
            summary: Version de l'API
            description: Retourne la version semver du backend lue depuis package.json.
            responses:
                "200":
                    description: Informations de version
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    name:
                                        type: string
                                        example: backend
                                    version:
                                        type: string
                                        example: "1.0.0"
                                    env:
                                        type: string
                                        enum: [development, test, production]
                                        example: production
                                    api:
                                        type: string
                                        example: v1

    # ── Auth ──────────────────────────────────────────────────────────────────

    /api/v1/auth/register:
        post:
            tags: [Auth]
            summary: Créer un compte
            description: >
                Crée un compte utilisateur. Le mot de passe doit respecter les règles de sécurité :
                8 caractères minimum, au moins une majuscule, une minuscule, un chiffre et un caractère spécial.
                Retourne un access token (15 min) et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
                        example:
                            email: "alex@example.com"
                            username: "alexf1"
                            password: "Passw0rd!"
                            confirmPassword: "Passw0rd!"
                            country: "France"
                            language: "fr"
            responses:
                "201":
                    description: Compte créé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "400":
                    description: Validation échouée ou email/username déjà utilisé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Connexion
            description: >
                Connexion par email ou username. Retourne un access token (15 min)
                et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
                        example:
                            identifier: "alex@example.com"
                            password: "Passw0rd!"
            responses:
                "200":
                    description: Connexion réussie
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "401":
                    description: Identifiants invalides
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/refresh:
        post:
            tags: [Auth]
            summary: Rafraîchir les tokens
            description: >
                Échange un refresh token valide contre un nouvel access token (15 min)
                et un nouveau refresh token (7 jours). Rotation à chaque appel.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RefreshTokenRequest"
            responses:
                "200":
                    description: Tokens rafraîchis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RefreshResponse"
                "401":
                    description: Refresh token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/verify-email:
        get:
            tags: [Auth]
            summary: Vérifier l'adresse email
            description: Valide le token de vérification d'email envoyé à l'inscription.
            parameters:
                - name: token
                  in: query
                  required: true
                  description: Token JWT de vérification d'email
                  schema:
                      type: string
            responses:
                "200":
                    description: Email vérifié avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/resend-verify-email:
        post:
            tags: [Auth]
            summary: Renvoyer l'email de vérification
            description: Renvoie un token de vérification d'email. Requiert d'être connecté.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Email renvoyé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Email déjà vérifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/change-password:
        post:
            tags: [Auth]
            summary: Changer le mot de passe
            description: >
                Modifie le mot de passe de l'utilisateur connecté.
                Le nouveau mot de passe doit respecter les règles de sécurité.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ChangePasswordRequest"
            responses:
                "200":
                    description: Mot de passe modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Validation échouée ou mot de passe actuel incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/forgot-password:
        post:
            tags: [Auth]
            summary: Demander la réinitialisation du mot de passe
            description: >
                Envoie un email de réinitialisation si l'adresse est connue.
                Retourne toujours 200 pour éviter l'énumération d'emails.
                Le token de réinitialisation expire après 1 heure.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ForgotPasswordRequest"
                        example:
                            email: "alex@example.com"
            responses:
                "200":
                    description: Demande traitée (email envoyé si l'adresse existe)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/reset-password:
        post:
            tags: [Auth]
            summary: Réinitialiser le mot de passe
            description: >
                Réinitialise le mot de passe à partir du token reçu par email.
                Le token expire après 1 heure. Le nouveau mot de passe doit respecter
                les règles de sécurité.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Mot de passe réinitialisé avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide/expiré ou validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/delete-account:
        delete:
            tags: [Auth]
            summary: Supprimer le compte
            description: >
                Supprime définitivement le compte et toutes les données associées
                (profil, pronostics, ligues, conversations). Requiert le mot de passe.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeleteAccountRequest"
            responses:
                "200":
                    description: Compte supprimé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Mot de passe incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Utilisateurs ──────────────────────────────────────────────────────────

    /api/v1/users/me:
        get:
            tags: [Utilisateurs]
            summary: Mon profil complet
            description: Retourne le compte courant avec profil et rôles.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Profil complet
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        patch:
            tags: [Utilisateurs]
            summary: Mettre à jour mon profil
            description: Patch partiel du compte et/ou du profil utilisateur.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateMeRequest"
            responses:
                "200":
                    description: Profil mis à jour
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: Conflit (username déjà utilisé)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/users/{id}/public:
        get:
            tags: [Utilisateurs]
            summary: Profil public d'un utilisateur
            description: >
                Retourne le profil uniquement si l'utilisateur est actif
                et que son profil est public.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            responses:
                "200":
                    description: Profil public
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserPublicResponse"
                "404":
                    description: Profil introuvable (ou non public / utilisateur inactif)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Admin ─────────────────────────────────────────────────────────────────

    /api/v1/admin/users:
        get:
            tags: [Admin]
            summary: Lister les utilisateurs
            description: Nécessite un JWT avec le rôle `admin`. Liste paginée.
            security:
                - bearerAuth: []
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Recherche par email ou username
                  schema:
                      type: string
                      maxLength: 120
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                - name: offset
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
            responses:
                "200":
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AdminUsersListResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/users/{id}:
        patch:
            tags: [Admin]
            summary: Modifier un utilisateur
            description: >
                Nécessite un JWT avec le rôle `admin`.
                Permet d'activer/désactiver un compte et de valider l'email.
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AdminUpdateUserRequest"
            responses:
                "200":
                    description: Utilisateur modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Utilisateur introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Sessions ──────────────────────────────────────────────────────────────

    /api/v1/sessions:
        get:
            tags: [Sessions]
            summary: Lister les sessions
            parameters:
                - name: type
                  in: query
                  required: false
                  description: "Filtrer par type (Race, Qualifying, Sprint…)"
                  schema:
                      type: string
                      example: Race
                - name: limit
                  in: query
                  schema: { type: integer, default: 20 }
                - name: offset
                  in: query
                  schema: { type: integer, default: 0 }
            responses:
                "200":
                    description: Liste des sessions
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SessionsListResponse"

    /api/v1/sessions/{sessionId}:
        get:
            tags: [Sessions]
            summary: Détail d'une session
            parameters:
                - $ref: "#/components/parameters/SessionId"
            responses:
                "200":
                    description: Session
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SessionResponse"
                "404":
                    $ref: "#/components/responses/NotFound"

    /api/v1/admin/sessions/sync-openf1:
        post:
            tags: [Sessions]
            summary: Synchroniser les sessions depuis OpenF1 (admin)
            description: Importe et met à jour les sessions de l'année courante (ou d'une année donnée) depuis l'API OpenF1.
            security:
                - bearerAuth: []
            parameters:
                - in: query
                  name: year
                  schema:
                      type: integer
                      example: 2025
                  description: Année à synchroniser (défaut = année courante)
            responses:
                "200":
                    description: Synchronisation réussie
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:  { type: string, example: ok }
                                    created: { type: integer, example: 12 }
                                    updated: { type: integer, example: 3 }
                                    total:   { type: integer, example: 15 }
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /api/v1/admin/sessions:
        post:
            tags: [Sessions]
            summary: Créer une session (admin)
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateSessionRequest"
            responses:
                "201":
                    description: Session créée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SessionResponse"
                "400":
                    $ref: "#/components/responses/ValidationError"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /api/v1/admin/sessions/{sessionId}:
        patch:
            tags: [Sessions]
            summary: Modifier une session (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/SessionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateSessionRequest"
            responses:
                "200":
                    description: Session modifiée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SessionResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

        delete:
            tags: [Sessions]
            summary: Supprimer une session (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/SessionId"
            responses:
                "200":
                    description: Session supprimée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    # ── Predictions ───────────────────────────────────────────────────────────

    /api/v1/sessions/{sessionId}/predictions:
        get:
            tags: [Predictions]
            summary: Prédictions d'une session
            description: Retourne toutes les prédictions ouvertes (ou fermées) d'une session.
            parameters:
                - $ref: "#/components/parameters/SessionId"
            responses:
                "200":
                    description: Liste des prédictions
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PredictionsListResponse"

    /api/v1/predictions/{predictionId}:
        get:
            tags: [Predictions]
            summary: Détail d'une prédiction
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            responses:
                "200":
                    description: Prédiction
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PredictionResponse"
                "404":
                    $ref: "#/components/responses/NotFound"

    /api/v1/admin/sessions/{sessionId}/predictions:
        post:
            tags: [Predictions]
            summary: Créer une prédiction pour une session (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/SessionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreatePredictionRequest"
                        example:
                            title: "Qui remporte la course ?"
                            scope: "race"
                            closesAt: "2024-09-01T13:00:00Z"
                            defaultMultiplier: 2.5
            responses:
                "201":
                    description: Prédiction créée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PredictionResponse"
                "400":
                    $ref: "#/components/responses/ValidationError"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /api/v1/admin/predictions/{predictionId}:
        patch:
            tags: [Predictions]
            summary: Modifier une prédiction (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePredictionRequest"
            responses:
                "200":
                    description: Prédiction modifiée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PredictionResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

        delete:
            tags: [Predictions]
            summary: Supprimer une prédiction (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            responses:
                "200":
                    description: Prédiction supprimée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    /api/v1/admin/predictions/{predictionId}/resolve:
        post:
            tags: [Predictions]
            summary: Résoudre une prédiction (admin)
            description: >
                Fournit la `winningValue`. Pour chaque pronostic `submitted` :

                - **won** → `pointsEarned = pointsStaked × multiplier`, crédité sur `profile.points`

                - **lost** → `pointsEarned = 0` (mise déjà déduite lors du pari)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResolveRequest"
                        example:
                            winningValue: "Leclerc"
            responses:
                "200":
                    description: Prédiction résolue
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    resolved:
                                        type: integer
                                        description: Nombre de pronostics traités
                                        example: 42
                                    winningValue:
                                        type: string
                                        example: "Leclerc"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    /api/v1/admin/predictions/{predictionId}/pronostics:
        get:
            tags: [Predictions]
            summary: Voir tous les pronostics d'une prédiction (admin)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            responses:
                "200":
                    description: Liste de tous les pronostics
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PronosticsListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    # ── Pronostics (paris user) ───────────────────────────────────────────────

    /api/v1/predictions/{predictionId}/pronostic:
        get:
            tags: [Pronostics]
            summary: Mon pronostic sur cette prédiction
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            responses:
                "200":
                    description: Pronostic existant
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PronosticResponse"
                "404":
                    description: Aucun pronostic placé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"

        post:
            tags: [Pronostics]
            summary: Placer un pari
            description: >
                Crée un `pronostic` + `pronostic_detail` pour la prédiction.

                **Débit immédiat** de `pointsStaked` sur `profile.points`.
                La mise est perdue si la prédiction est perdante.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PlacePronosticRequest"
                        example:
                            value: "Leclerc"
                            pointsStaked: 100
            responses:
                "201":
                    description: Pari enregistré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PronosticResponse"
                "400":
                    $ref: "#/components/responses/ValidationError"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "409":
                    description: Pronostic déjà placé sur cette prédiction
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: Prédiction fermée ou points insuffisants
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        patch:
            tags: [Pronostics]
            summary: Modifier mon pari (avant fermeture)
            description: >
                Modifie `value` et/ou `pointsStaked`.
                La différence de mise est débitée ou remboursée sur `profile.points`.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePronosticRequest"
            responses:
                "200":
                    description: Pari modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PronosticResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    description: Prédiction fermée ou points insuffisants
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        delete:
            tags: [Pronostics]
            summary: Annuler mon pari (avant fermeture)
            description: >
                Supprime le pronostic et **rembourse** `pointsStaked` sur `profile.points`.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/PredictionId"
            responses:
                "200":
                    description: Pari annulé et points remboursés
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    description: Impossible d'annuler après la fermeture
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/users/me/pronostics:
        get:
            tags: [Pronostics]
            summary: Historique de mes paris
            security:
                - bearerAuth: []
            parameters:
                - name: status
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: [draft, submitted, won, lost, void]
                - name: limit
                  in: query
                  schema: { type: integer, default: 20 }
                - name: offset
                  in: query
                  schema: { type: integer, default: 0 }
            responses:
                "200":
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MyPronosticsListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"

    /api/v1/sessions/{sessionId}/pronostics/me:
        get:
            tags: [Pronostics]
            summary: Mes paris pour une session
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/SessionId"
            responses:
                "200":
                    description: Paris de la session
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PronosticsListResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"

    # ── Badges ────────────────────────────────────────────────────────────────

    /api/v1/users/me/badges:
        get:
            tags: [Badges]
            summary: Mes badges
            description: Retourne tous les badges de l'utilisateur connecté avec la date d'attribution.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Liste de badges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserBadgesResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/users/{id}/badges:
        get:
            tags: [Badges]
            summary: Badges d'un utilisateur
            description: Retourne les badges d'un utilisateur (endpoint public).
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            responses:
                "200":
                    description: Liste de badges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserBadgesResponse"
                "404":
                    description: Utilisateur introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/badges:
        get:
            tags: [Badges]
            summary: Lister tous les badges
            description: Retourne le catalogue complet des badges. Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Catalogue de badges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BadgesListResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        post:
            tags: [Badges]
            summary: Créer un badge
            description: Crée un nouveau badge dans le catalogue. Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateBadgeRequest"
                        example:
                            name: "Prophète"
                            code: "prophet"
                            description: "A prédit le résultat exact 10 fois"
                            rarity: "rare"
            responses:
                "201":
                    description: Badge créé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BadgeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/badges/{badgeId}:
        patch:
            tags: [Badges]
            summary: Modifier un badge
            description: Met à jour un badge existant. Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            parameters:
                - name: badgeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateBadgeRequest"
            responses:
                "200":
                    description: Badge modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BadgeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Badge introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        delete:
            tags: [Badges]
            summary: Supprimer un badge
            description: Supprime un badge et retire tous les `user_badges` associés (CASCADE). Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            parameters:
                - name: badgeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 1
            responses:
                "200":
                    description: Badge supprimé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Badge introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/users/{id}/badges:
        post:
            tags: [Badges]
            summary: Attribuer un badge à un utilisateur
            description: Attribue manuellement un badge à un utilisateur. Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AwardBadgeRequest"
                        example:
                            badgeId: 3
            responses:
                "201":
                    description: Badge attribué
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserBadgeItemResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Utilisateur ou badge introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: L'utilisateur possède déjà ce badge
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/users/{id}/badges/{badgeId}:
        delete:
            tags: [Badges]
            summary: Retirer un badge à un utilisateur
            description: Révoque un badge attribué à un utilisateur. Nécessite le rôle `admin`.
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
                - name: badgeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 3
            responses:
                "200":
                    description: Badge retiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Badge non attribué à cet utilisateur
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── OpenF1 REST ───────────────────────────────────────────────────────────

    /api/v1/openf1/calendar:
        get:
            tags: [OpenF1]
            summary: Calendrier F1 d'une année
            description: Retourne tous les meetings (GP) de l'année spécifiée (défaut = année courante).
            parameters:
                - name: year
                  in: query
                  required: false
                  description: "Année du calendrier (ex: 2026)"
                  schema:
                      type: integer
                      example: 2026
            responses:
                "200":
                    description: Liste complète des meetings de l'année
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    meetings:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Meeting"
                "502":
                    description: Erreur de communication avec l'API OpenF1

    /api/v1/openf1/upcoming:
        get:
            tags: [OpenF1]
            summary: Prochaines sessions F1
            description: Retourne les prochaines sessions dont la date de début est dans le futur, triées par date.
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: Nombre maximum de sessions à retourner (défaut 10)
                  schema:
                      type: integer
                      default: 10
                      example: 5
            responses:
                "200":
                    description: Liste des prochaines sessions
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    sessions:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Session"
                "502":
                    description: Erreur de communication avec l'API OpenF1

    /api/v1/openf1/next-session:
        get:
            tags: [OpenF1]
            summary: Prochaine session F1
            description: Retourne la toute prochaine session F1 à venir.
            responses:
                "200":
                    description: Prochaine session (null si aucune trouvée)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    session:
                                        nullable: true
                                        allOf:
                                            - $ref: "#/components/schemas/F1Session"
                "502":
                    description: Erreur de communication avec l'API OpenF1

    /api/v1/openf1/meetings:
        get:
            tags: [OpenF1]
            summary: Lister les Grands Prix
            description: Retourne tous les GP de la saison (ou filtrés).
            parameters:
                - name: year
                  in: query
                  required: false
                  description: "Année (ex: 2024)"
                  schema:
                      type: integer
                      example: 2024
                - name: country_code
                  in: query
                  required: false
                  description: "Code pays ISO (ex: IT)"
                  schema:
                      type: string
                      example: IT
            responses:
                "200":
                    description: Liste des GP
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    meetings:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Meeting"
                "502":
                    description: Erreur de communication avec l'API OpenF1

    /api/v1/openf1/meetings/latest:
        get:
            tags: [OpenF1]
            summary: Dernier / prochain Grand Prix
            description: Retourne le meeting le plus récent selon OpenF1.
            responses:
                "200":
                    description: Grand Prix
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    meeting:
                                        $ref: "#/components/schemas/F1Meeting"

    /api/v1/openf1/sessions:
        get:
            tags: [OpenF1]
            summary: Lister les sessions
            description: Retourne les sessions (Qualifications, Race, Sprint…).
            parameters:
                - name: meeting_key
                  in: query
                  required: false
                  description: Clé du meeting
                  schema:
                      type: integer
                      example: 1217
                - name: session_type
                  in: query
                  required: false
                  description: "Type de session (Race, Qualifying, Sprint…)"
                  schema:
                      type: string
                      example: Race
                - name: year
                  in: query
                  required: false
                  schema:
                      type: integer
                      example: 2024
            responses:
                "200":
                    description: Liste des sessions
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    sessions:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Session"

