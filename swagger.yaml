openapi: 3.0.3
info:
    title: PoleWin API
    version: 1.0.0
    description: >
        API backend PoleWin (F1) — Express 5 + TypeScript + PostgreSQL/Sequelize.

        **Authentification** : Bearer JWT (access token 15 min).
        Obtenez un token via `POST /api/v1/auth/login` ou `POST /api/v1/auth/register`,
        puis rafraîchissez-le via `POST /api/v1/auth/refresh` (refresh token 7 jours).

servers:
    - url: http://localhost:8000
      description: Serveur local

tags:
    - name: Auth
      description: Inscription, connexion, tokens, mot de passe
    - name: Utilisateurs
      description: Profil et compte utilisateur
    - name: Admin
      description: Administration (rôle admin requis)
    - name: Health
      description: Endpoints de diagnostic
    - name: OpenF1
      description: Données F1 statiques via l'API OpenF1 (public, aucune auth requise)
    - name: OpenF1 Live
      description: Streams temps réel SSE via OpenF1 — connexion persistante

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:

    # ── Health ────────────────────────────────────────────────────────────────

    /api/v1/health:
        get:
            tags: [Health]
            summary: Vérifier que l'API est en ligne
            responses:
                "200":
                    description: API opérationnelle
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthResponse"
                "500":
                    description: Erreur serveur
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Auth ──────────────────────────────────────────────────────────────────

    /api/v1/auth/register:
        post:
            tags: [Auth]
            summary: Créer un compte
            description: >
                Crée un compte utilisateur. Le mot de passe doit respecter les règles de sécurité :
                8 caractères minimum, au moins une majuscule, une minuscule, un chiffre et un caractère spécial.
                Retourne un access token (15 min) et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
                        example:
                            email: "alex@example.com"
                            username: "alexf1"
                            password: "Passw0rd!"
                            confirmPassword: "Passw0rd!"
                            country: "France"
                            language: "fr"
            responses:
                "201":
                    description: Compte créé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "400":
                    description: Validation échouée ou email/username déjà utilisé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Connexion
            description: >
                Connexion par email ou username. Retourne un access token (15 min)
                et un refresh token (7 jours).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
                        example:
                            identifier: "alex@example.com"
                            password: "Passw0rd!"
            responses:
                "200":
                    description: Connexion réussie
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthTokensResponse"
                "401":
                    description: Identifiants invalides
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/refresh:
        post:
            tags: [Auth]
            summary: Rafraîchir les tokens
            description: >
                Échange un refresh token valide contre un nouvel access token (15 min)
                et un nouveau refresh token (7 jours). Rotation à chaque appel.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RefreshTokenRequest"
            responses:
                "200":
                    description: Tokens rafraîchis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RefreshResponse"
                "401":
                    description: Refresh token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/verify-email:
        get:
            tags: [Auth]
            summary: Vérifier l'adresse email
            description: Valide le token de vérification d'email envoyé à l'inscription.
            parameters:
                - name: token
                  in: query
                  required: true
                  description: Token JWT de vérification d'email
                  schema:
                      type: string
            responses:
                "200":
                    description: Email vérifié avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide ou expiré
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/resend-verify-email:
        post:
            tags: [Auth]
            summary: Renvoyer l'email de vérification
            description: Renvoie un token de vérification d'email. Requiert d'être connecté.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Email renvoyé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Email déjà vérifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/change-password:
        post:
            tags: [Auth]
            summary: Changer le mot de passe
            description: >
                Modifie le mot de passe de l'utilisateur connecté.
                Le nouveau mot de passe doit respecter les règles de sécurité.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ChangePasswordRequest"
            responses:
                "200":
                    description: Mot de passe modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Validation échouée ou mot de passe actuel incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/forgot-password:
        post:
            tags: [Auth]
            summary: Demander la réinitialisation du mot de passe
            description: >
                Envoie un email de réinitialisation si l'adresse est connue.
                Retourne toujours 200 pour éviter l'énumération d'emails.
                Le token de réinitialisation expire après 1 heure.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ForgotPasswordRequest"
                        example:
                            email: "alex@example.com"
            responses:
                "200":
                    description: Demande traitée (email envoyé si l'adresse existe)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/reset-password:
        post:
            tags: [Auth]
            summary: Réinitialiser le mot de passe
            description: >
                Réinitialise le mot de passe à partir du token reçu par email.
                Le token expire après 1 heure. Le nouveau mot de passe doit respecter
                les règles de sécurité.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Mot de passe réinitialisé avec succès
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Token invalide/expiré ou validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Trop de requêtes (rate limit)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/auth/delete-account:
        delete:
            tags: [Auth]
            summary: Supprimer le compte
            description: >
                Supprime définitivement le compte et toutes les données associées
                (profil, pronostics, ligues, conversations). Requiert le mot de passe.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeleteAccountRequest"
            responses:
                "200":
                    description: Compte supprimé
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StatusOkResponse"
                "400":
                    description: Mot de passe incorrect
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Utilisateurs ──────────────────────────────────────────────────────────

    /api/v1/users/me:
        get:
            tags: [Utilisateurs]
            summary: Mon profil complet
            description: Retourne le compte courant avec profil et rôles.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Profil complet
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

        patch:
            tags: [Utilisateurs]
            summary: Mettre à jour mon profil
            description: Patch partiel du compte et/ou du profil utilisateur.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateMeRequest"
            responses:
                "200":
                    description: Profil mis à jour
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: Conflit (username déjà utilisé)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/users/{id}/public:
        get:
            tags: [Utilisateurs]
            summary: Profil public d'un utilisateur
            description: >
                Retourne le profil uniquement si l'utilisateur est actif
                et que son profil est public.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            responses:
                "200":
                    description: Profil public
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserPublicResponse"
                "404":
                    description: Profil introuvable (ou non public / utilisateur inactif)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── Admin ─────────────────────────────────────────────────────────────────

    /api/v1/admin/users:
        get:
            tags: [Admin]
            summary: Lister les utilisateurs
            description: Nécessite un JWT avec le rôle `admin`. Liste paginée.
            security:
                - bearerAuth: []
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Recherche par email ou username
                  schema:
                      type: string
                      maxLength: 120
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                - name: offset
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
            responses:
                "200":
                    description: Liste paginée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AdminUsersListResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/admin/users/{id}:
        patch:
            tags: [Admin]
            summary: Modifier un utilisateur
            description: >
                Nécessite un JWT avec le rôle `admin`.
                Permet d'activer/désactiver un compte et de valider l'email.
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant utilisateur (BIGINT, renvoyé en string)
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AdminUpdateUserRequest"
            responses:
                "200":
                    description: Utilisateur modifié
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserMeResponse"
                "400":
                    description: Validation échouée
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: JWT manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Rôle admin requis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Utilisateur introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    # ── OpenF1 REST ───────────────────────────────────────────────────────────

    /api/v1/openf1/meetings:
        get:
            tags: [OpenF1]
            summary: Lister les Grands Prix
            description: Retourne tous les GP de la saison (ou filtrés).
            parameters:
                - name: year
                  in: query
                  required: false
                  description: "Année (ex: 2024)"
                  schema:
                      type: integer
                      example: 2024
                - name: country_code
                  in: query
                  required: false
                  description: "Code pays ISO (ex: IT)"
                  schema:
                      type: string
                      example: IT
            responses:
                "200":
                    description: Liste des GP
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    meetings:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Meeting"
                "502":
                    description: Erreur de communication avec l'API OpenF1

    /api/v1/openf1/meetings/latest:
        get:
            tags: [OpenF1]
            summary: Dernier / prochain Grand Prix
            description: Retourne le meeting le plus récent selon OpenF1.
            responses:
                "200":
                    description: Grand Prix
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    meeting:
                                        $ref: "#/components/schemas/F1Meeting"

    /api/v1/openf1/sessions:
        get:
            tags: [OpenF1]
            summary: Lister les sessions
            description: Retourne les sessions (Qualifications, Race, Sprint…).
            parameters:
                - name: meeting_key
                  in: query
                  required: false
                  description: Clé du meeting
                  schema:
                      type: integer
                      example: 1217
                - name: session_type
                  in: query
                  required: false
                  description: "Type de session (Race, Qualifying, Sprint…)"
                  schema:
                      type: string
                      example: Race
                - name: year
                  in: query
                  required: false
                  schema:
                      type: integer
                      example: 2024
            responses:
                "200":
                    description: Liste des sessions
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    sessions:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Session"

    /api/v1/openf1/sessions/latest:
        get:
            tags: [OpenF1]
            summary: Session en cours / la plus récente
            responses:
                "200":
                    description: Session
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    session:
                                        $ref: "#/components/schemas/F1Session"

    /api/v1/openf1/sessions/{sessionKey}:
        get:
            tags: [OpenF1]
            summary: Détail d'une session
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Session
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    session:
                                        $ref: "#/components/schemas/F1Session"
                "404":
                    description: Session introuvable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/v1/openf1/sessions/{sessionKey}/drivers:
        get:
            tags: [OpenF1]
            summary: Pilotes d'une session
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Liste des pilotes
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    drivers:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1Driver"

    /api/v1/openf1/sessions/{sessionKey}/race-control:
        get:
            tags: [OpenF1]
            summary: Messages Race Control d'une session
            description: >
                Retourne les messages de direction de course : drapeaux, safety car,
                virtual safety car, DRS, etc.
            parameters:
                - name: sessionKey
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 9158
            responses:
                "200":
                    description: Événements race control
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    events:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/F1RaceControl"

    # ── OpenF1 Live (SSE) ─────────────────────────────────────────────────────

    /api/v1/openf1/live/session:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — session en cours
            description: >
                Connexion **Server-Sent Events** persistante. Envoie la session courante
                immédiatement (cache), puis toutes les 30 s si elle change.

                **Event name :** `session`

                **Heartbeat :** `:heartbeat` toutes les 15 s pour maintenir la connexion.
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: session\ndata: {\"session_key\": 9158, ...}\n\n"

    /api/v1/openf1/live/race-control:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — race control en temps réel
            description: >
                Reçoit uniquement les **nouveaux** messages race control toutes les 5 s
                (safety car, drapeau rouge, VSC, DRS…). Delta-only.

                **Event name :** `race_control`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: race_control\ndata: [{\"message\": \"SAFETY CAR DEPLOYED\", ...}]\n\n"

    /api/v1/openf1/live/positions:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — positions en temps réel
            description: >
                Classement complet mis à jour toutes les 5 s (1 entrée par pilote,
                dédupliquée sur `driver_number`).

                **Event name :** `positions`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: positions\ndata: [{\"driver_number\": 1, \"position\": 1, ...}]\n\n"

    /api/v1/openf1/live/laps:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — tours en temps réel
            description: >
                Envoie les nouveaux tours complétés toutes les 10 s. Delta-only.

                **Event name :** `laps`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: laps\ndata: [{\"driver_number\": 1, \"lap_number\": 12, ...}]\n\n"

    /api/v1/openf1/live/intervals:
        get:
            tags: [OpenF1 Live]
            summary: Stream SSE — intervalles en temps réel
            description: >
                Écarts par rapport au leader mis à jour toutes les 10 s
                (1 entrée par pilote, dédupliquée).

                **Event name :** `intervals`
            responses:
                "200":
                    description: Stream SSE établi
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                example: "event: intervals\ndata: [{\"driver_number\": 1, \"gap_to_leader\": 0, ...}]\n\n"

# ─── Components ───────────────────────────────────────────────────────────────

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: "JWT dans l'en-tête Authorization: Bearer <token>"

    schemas:

        # ── OpenF1 ────────────────────────────────────────────────────────────

        F1Meeting:
            type: object
            properties:
                meeting_key:
                    type: integer
                    example: 1217
                meeting_name:
                    type: string
                    example: "Italian Grand Prix"
                meeting_official_name:
                    type: string
                    example: "FORMULA 1 PIRELLI GRAN PREMIO D'ITALIA 2024"
                circuit_short_name:
                    type: string
                    example: "Monza"
                country_name:
                    type: string
                    example: "Italy"
                country_code:
                    type: string
                    example: "IT"
                location:
                    type: string
                    example: "Monza"
                date_start:
                    type: string
                    format: date-time
                    example: "2024-08-29T11:30:00+00:00"
                year:
                    type: integer
                    example: 2024

        F1Session:
            type: object
            properties:
                session_key:
                    type: integer
                    example: 9158
                meeting_key:
                    type: integer
                    example: 1217
                session_name:
                    type: string
                    example: "Race"
                session_type:
                    type: string
                    example: "Race"
                circuit_short_name:
                    type: string
                    example: "Monza"
                country_name:
                    type: string
                    example: "Italy"
                country_code:
                    type: string
                    example: "IT"
                date_start:
                    type: string
                    format: date-time
                    example: "2024-09-01T13:00:00+00:00"
                date_end:
                    type: string
                    format: date-time
                    example: "2024-09-01T15:00:00+00:00"
                year:
                    type: integer
                    example: 2024

        F1Driver:
            type: object
            properties:
                driver_number:
                    type: integer
                    example: 16
