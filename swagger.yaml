        # ── Règles de mot de passe ────────────────────────────────────────────
        # 8 car. min · 1 majuscule · 1 minuscule · 1 chiffre · 1 caractère spécial

        PasswordStrong:
            type: string
            minLength: 8
            maxLength: 200
            description: >
                Mot de passe fort : 8 caractères minimum, au moins une majuscule,
                une minuscule, un chiffre et un caractère spécial (!@#$%^&*…).
            example: "Passw0rd!"

        # ── Requêtes Auth ─────────────────────────────────────────────────────

        RegisterRequest:
            type: object
            required: [email, username, password, confirmPassword]
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 255
                    example: "alex@example.com"
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                    example: "alexf1"
                password:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmPassword:
                    type: string
                    description: Doit être identique à `password`
                    example: "Passw0rd!"
                dateOfBirth:
                    type: string
                    format: date
                    example: "2001-06-20"
                country:
                    type: string
                    maxLength: 100
                    example: "France"
                language:
                    type: string
                    maxLength: 20
                    example: "fr"

        LoginRequest:
            type: object
            required: [identifier, password]
            properties:
                identifier:
                    type: string
                    minLength: 3
                    maxLength: 255
                    description: Email ou username
                    example: "alex@example.com"
                password:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "Passw0rd!"

        RefreshTokenRequest:
            type: object
            required: [refreshToken]
            properties:
                refreshToken:
                    type: string
                    description: Refresh token JWT (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."

        ChangePasswordRequest:
            type: object
            required: [currentPassword, newPassword, confirmNewPassword]
            properties:
                currentPassword:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "OldPassw0rd!"
                newPassword:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmNewPassword:
                    type: string
                    description: Doit être identique à `newPassword`
                    example: "NewPassw0rd!"

        ForgotPasswordRequest:
            type: object
            required: [email]
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 255
                    example: "alex@example.com"

        ResetPasswordRequest:
            type: object
            required: [token, newPassword, confirmNewPassword]
            properties:
                token:
                    type: string
                    description: Token de réinitialisation reçu par email (valide 1h)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                newPassword:
                    $ref: "#/components/schemas/PasswordStrong"
                confirmNewPassword:
                    type: string
                    description: Doit être identique à `newPassword`
                    example: "NewPassw0rd!"

        DeleteAccountRequest:
            type: object
            required: [password]
            properties:
                password:
                    type: string
                    minLength: 1
                    maxLength: 200
                    example: "Passw0rd!"

        # ── Réponses Auth ─────────────────────────────────────────────────────

        AuthUser:
            type: object
            properties:
                id:
                    type: string
                    description: BIGINT renvoyé en string
                    example: "1"
                email:
                    type: string
                    format: email
                    example: "alex@example.com"
                username:
                    type: string
                    example: "alexf1"
                roles:
                    type: array
                    items:
                        type: string
                    example: ["user"]

        AuthTokensResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    example: true
                accessToken:
                    type: string
                    description: JWT d'accès (15 min)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                refreshToken:
                    type: string
                    description: JWT de rafraîchissement (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                verifyEmailToken:
                    type: string
                    description: Token de vérification email (24h) — uniquement à l'inscription
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                user:
                    $ref: "#/components/schemas/AuthUser"
            required: [ok, accessToken, refreshToken, user]

        RefreshResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    example: true
                accessToken:
                    type: string
                    description: Nouvel access token (15 min)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
                refreshToken:
                    type: string
                    description: Nouveau refresh token (7 jours)
                    example: "eyJhbGciOiJIUzI1NiJ9..."
            required: [ok, accessToken, refreshToken]

        StatusOkResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
            required: [status]

