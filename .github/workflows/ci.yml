name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: polewin-backend:${{ github.sha }}
  DOCKERFILE: Dockerfile.prod
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0-alpine
  DIVE_IMAGE: wagoodman/dive:v0.12.0

jobs:
  build-test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
        continue-on-error: true

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint du Dockerfile
        run: |
          docker run --rm -i \
            -v "$PWD/.hadolint.yaml:/hadolint.yaml:ro" \
            "$HADOLINT_IMAGE" hadolint --config /hadolint.yaml - < "$DOCKERFILE"

  trivy-fs:
    name: Trivy FS (dépendances, secrets, misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan du dépôt
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore \
              --skip-dirs node_modules,dist,coverage \
              --exit-code 0 \
              --no-progress \
              --format sarif --output trivy-fs.sarif \
              .
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image:
    name: Image Docker (build, Trivy, Dive)
    runs-on: ubuntu-latest
    needs: hadolint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Trivy image (rapport SARIF)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore \
              --exit-code 0 --no-progress \
              --format sarif --output trivy-image.sarif \
              "$IMAGE"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image (quality gate HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore \
              --exit-code 1 --no-progress \
              "$IMAGE"
      - name: Dive (efficacité de l'image)
        run: |
          docker run --rm \
            -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" \
            "$DIVE_IMAGE" --ci-config /.dive-ci "$IMAGE"
